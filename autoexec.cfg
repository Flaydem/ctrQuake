// Touches 3DS pour ctrQuake
// A copier dans sd:/3ds/ctrQuake/id1/autoexec.cfg
// Execute a chaque lancement, apres config.cfg : ces touches ont le dernier mot.
// Pour changer une touche, modifie la ligne correspondante.
// START = Entree et SELECT = Echap sont fixes dans le code.

// Combat
bind RTRIGGER  +attack          // R : tirer
bind LTRIGGER  +jump            // L : sauter / nager vers le haut
bind PADUP     "impulse 10"     // Croix haut : arme suivante
bind PADDOWN   "impulse 12"     // Croix bas : arme precedente

// Camera (le Circle Pad sert a se deplacer, l'ecran tactile a viser)
bind YBUTTON   +left            // Y : tourner a gauche
bind ABUTTON   +right           // A : tourner a droite
bind XBUTTON   +lookup          // X : regarder en haut
bind BBUTTON   +lookdown        // B : regarder en bas

// Circle Pad gauche/droite = pas de cote (et non rotation)
lookstrafe 1
lookspring 0
